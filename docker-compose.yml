x-common-env: &common-env
  PUID: 501
  PGID: 20
  TZ: America/New_York
networks:
  servarrnetwork:
    driver: bridge
services:
  # -----------------------------------------------------------------------------------
  # Autoheal - Restarts unhealthy containers
  # -----------------------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 60
      AUTOHEAL_START_PERIOD: 300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  # -----------------------------------------------------------------------------------
  # Traefik - Reverse Proxy with SSL
  # -----------------------------------------------------------------------------------
  traefik:
    image: traefik
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8888:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./tofu-stack-secrets/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./tofu-stack-secrets:/etc/traefik/dynamic:ro
      - ./mounts/traefik/certs:/certs
      - ./mounts/traefik/logs:/var/log/traefik
      # Size-capped access-log rotation; run hourly by ofelia (labels below).
      # access.log had reached 506 MB unrotated and records API keys passed as
      # query params (sabnzbd/radarr ?apikey=...), so it must not grow unbounded.
      - ./mounts/traefik/rotate-logs.sh:/usr/local/bin/rotate-logs.sh:ro
    networks:
      - servarrnetwork
    labels:
      - "traefik.enable=true"
      # Traefik dashboard - local
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.home.arpa`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard-http.rule=Host(`traefik.home.arpa`)"
      - "traefik.http.routers.traefik-dashboard-http.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      # Traefik dashboard - Cloudflare tunnel
      - "traefik.http.routers.traefik-dashboard-cf.rule=Host(`traefik.majordoob.com`)"
      - "traefik.http.routers.traefik-dashboard-cf.entrypoints=web"
      # access-log rotation - hourly size check (6-field cron: sec min hour dom mon dow)
      - "ofelia.enabled=true"
      - "ofelia.job-exec.traefik-logrotate.schedule=0 0 * * * *"
      - "ofelia.job-exec.traefik-logrotate.command=/bin/sh /usr/local/bin/rotate-logs.sh"
      - "traefik.http.routers.traefik-dashboard-cf.service=api@internal"
    environment:
      !!merge <<: *common-env
  # -----------------------------------------------------------------------------------
  ## VPN Tunnel service. This allows all the services that connect through the ports
  ## to be forwareded to the VPN server that the service is assigned to
  # -----------------------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8000:8000 # gluetun built in web api
      - 8080:8080 # qbittorrent web interface
      - 6881:6881 # qbittorrent torrent port
      - 8118:8888 # HTTP proxy for prowlarr indexers (privoxy standard port)
    volumes:
      - ./mounts/gluetun:/gluetun
      - ./tofu-stack-secrets/gluten_auth_config.toml:/gluetun/auth/config.toml:ro
      - gluetun-tmp:/tmp/gluetun
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: openvpn
      SERVER_COUNTRIES: United States
      OPENVPN_USER_SECRETFILE: /run/secrets/openvpn_user
      OPENVPN_PASSWORD_SECRETFILE: /run/secrets/openvpn_pass
      VPN_PORT_FORWARDING: on
      HTTPPROXY: on
      HTTPPROXY_LISTENING_ADDRESS: :8888
    secrets:
      - openvpn_user
      - openvpn_pass
    networks:
      - servarrnetwork
    # Healthcheck tests actual VPN connectivity, not just cached API response
    # Sends 5 pings and requires 0% packet loss to detect unstable connections
    healthcheck:
      test: ["CMD-SHELL", "ping -c 5 -W 2 8.8.8.8 | grep -q '0% packet loss'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      # qBittorrent routing - local (network_mode: service:gluetun)
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.home.arpa`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      - "traefik.http.routers.qbittorrent-http.rule=Host(`qbittorrent.home.arpa`)"
      - "traefik.http.routers.qbittorrent-http.entrypoints=web"
      - "traefik.http.routers.qbittorrent-http.middlewares=redirect-to-https"
      - "traefik.http.routers.qbittorrent-http.service=qbittorrent"
      # qBittorrent routing - Cloudflare tunnel
      - "traefik.http.routers.qbittorrent-cf.rule=Host(`qbittorrent.majordoob.com`)"
      - "traefik.http.routers.qbittorrent-cf.entrypoints=web"
      - "traefik.http.routers.qbittorrent-cf.service=qbittorrent"
    restart: unless-stopped
  # -----------------------------------------------------------------------------------
  ## qbittorrent is a torrent downloader. It is currently set to use the network stack
  ## of gluetun; meaning that it will be under the VPN when downloading
  # -----------------------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    cpus: 1
    # qBit's SIGTERM shutdown can take 60-90s with a large torrent count; default 10s
    # triggers SIGKILL mid-shutdown, which has left it in a bad Exited state in the past.
    stop_grace_period: 90s
    environment:
      !!merge <<: *common-env
      WEBUI_PORT: 8080
      QBITTORRENT_USER: ballsack
      QBITTORRENT_PASS: adminadmin
    volumes:
      - ./mounts/qbittorrent/appdata:/config
      - ./tofu-stack-secrets/qBittorrent.conf:/config/qBittorrent/qBittorrent.conf
      # create_host_path: false -> fail fast if the external drive isn't mounted,
      # instead of silently creating an empty dir on the boot SSD.
      - type: bind
        source: /Volumes/Plex-Storage/downloads/torrents
        target: /data/torrents
        bind:
          create_host_path: false
      - gluetun-tmp:/tmp/gluetun:ro
      - ./tofu-stack-secrets/sync-qbittorrent-port.sh:/usr/local/bin/sync-qbittorrent-port.sh:ro
    network_mode: "service:gluetun" # Routes ALL traffic through gluetun (Traefik labels are on gluetun service)
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 curl -f http://localhost:8080 || exit 1"]
      interval: 60s
      retries: 3
      start_period: 30s
      timeout: 10s
    labels:
      - "autoheal=true"
      - "ofelia.enabled=true"
      - "ofelia.job-exec.qbittorrent-port-sync.schedule=0 */5 * * * *"
      - "ofelia.job-exec.qbittorrent-port-sync.command=/usr/local/bin/sync-qbittorrent-port.sh"
    restart: unless-stopped
  # -----------------------------------------------------------------------------------
  # qbit-watchdog - Recovers qBittorrent from two failure modes that nothing else catches:
  #   1) Exited/dead state. autoheal only restarts running-but-unhealthy containers, and
  #      Docker's restart policy doesn't fire after a manual `docker restart` API call.
  #   2) Orphaned network namespace. When gluetun is restarted in-place (e.g. by autoheal),
  #      it gets a new netns but qBit keeps the old one. qBit's own healthcheck passes
  #      (localhost in the orphan still works) but the published port 8080 lands on a
  #      dead listener in gluetun's new netns, breaking sonarr/radarr → qbit. Detect by
  #      checking that the qBit listener is visible inside gluetun's current netns; if
  #      not, `docker restart qbittorrent` to re-attach.
  # Polls every 60s.
  # -----------------------------------------------------------------------------------
  qbit-watchdog:
    image: docker:cli
    container_name: qbit-watchdog
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - |
        while true; do
          state=$$(docker inspect -f '{{.State.Status}}' qbittorrent 2>/dev/null || echo missing)
          if [ "$$state" = "exited" ] || [ "$$state" = "dead" ]; then
            echo "[$$(date -Iseconds)] qbittorrent state=$$state, starting"
            docker start qbittorrent || echo "[$$(date -Iseconds)] start failed"
          elif [ "$$state" = "running" ]; then
            gluetun_state=$$(docker inspect -f '{{.State.Status}}' gluetun 2>/dev/null || echo missing)
            if [ "$$gluetun_state" = "running" ] && ! docker exec gluetun netstat -tln 2>/dev/null | grep -q ':8080 '; then
              echo "[$$(date -Iseconds)] qbit listener missing from gluetun netns (orphaned), restarting qbittorrent"
              docker restart qbittorrent || echo "[$$(date -Iseconds)] restart failed"
            fi
          fi
          sleep 60
        done
  # -----------------------------------------------------------------------------------
  # SABnzbd - Usenet downloader (replaced NZBGet due to SSL connection issues)
  # -----------------------------------------------------------------------------------
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    cpus: 5
    environment:
      !!merge <<: *common-env
    volumes:
      - ./mounts/sabnzbd:/config
      - type: bind
        source: /Volumes/Working-Storage/downloads/usenet
        target: /data/usenet
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 curl -f http://localhost:8080 || exit 1"]
      interval: 60s
      retries: 3
      start_period: 30s
      timeout: 10s
    labels:
      - "traefik.enable=true"
      # sabnzbd - local
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.home.arpa`)"
      - "traefik.http.routers.sabnzbd.entrypoints=websecure"
      - "traefik.http.routers.sabnzbd.tls=true"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"
      - "traefik.http.routers.sabnzbd-http.rule=Host(`sabnzbd.home.arpa`)"
      - "traefik.http.routers.sabnzbd-http.entrypoints=web"
      - "traefik.http.routers.sabnzbd-http.middlewares=redirect-to-https"
      # sabnzbd routing - Cloudflare tunnel (TLS terminates at Cloudflare, so entrypoint is `web`)
      # NOTE: also requires (a) a Public Hostname in the Cloudflare Zero Trust dashboard and
      # (b) sabnzbd.majordoob.com in SABnzbd's host_whitelist + inet_exposure raised.
      - "traefik.http.routers.sabnzbd-cf.rule=Host(`sabnzbd.majordoob.com`)"
      - "traefik.http.routers.sabnzbd-cf.entrypoints=web"
      - "traefik.http.routers.sabnzbd-cf.service=sabnzbd"
    ports:
      - 8085:8080
    networks:
      - servarrnetwork
  # -----------------------------------------------------------------------------------
  ## Set up the torrent indexer. This will index where to find the torrents.
  ## Tools like Raddarr will then pass matches from prowlarr to qbittorrent
  # -----------------------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      !!merge <<: *common-env
    volumes:
      - ./mounts/prowlarr:/config
    restart: unless-stopped
    ports:
      - 9696:9696
    networks:
      - servarrnetwork
    healthcheck:
      test: ["CMD", "ping", "-c", "1", "8.8.8.8"]
      interval: 60s
      retries: 3
      start_period: 20s
      timeout: 10s
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      # Prowlarr routing - local
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.home.arpa`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.routers.prowlarr.service=prowlarr"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.routers.prowlarr-http.rule=Host(`prowlarr.home.arpa`)"
      - "traefik.http.routers.prowlarr-http.entrypoints=web"
      - "traefik.http.routers.prowlarr-http.middlewares=redirect-to-https"
      - "traefik.http.routers.prowlarr-http.service=prowlarr"
      # Prowlarr routing - Cloudflare tunnel
      - "traefik.http.routers.prowlarr-cf.rule=Host(`prowlarr.majordoob.com`)"
      - "traefik.http.routers.prowlarr-cf.entrypoints=web"
      - "traefik.http.routers.prowlarr-cf.service=prowlarr"
  # -----------------------------------------------------------------------------------
  # Setup sonarr used to manage TV shows and submit the torrent to qbittoreent
  # -----------------------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      !!merge <<: *common-env
    volumes:
      - sonarr-config:/config
      # Single parent mount: /data/media and /data/downloads/torrents live under ONE mount,
      # which is what makes hardlinks possible. Separate bind mounts fail cross-device even
      # on the same host volume. See AGENTS.md -> HARDLINKS.
      - type: bind
        source: /Volumes/Plex-Storage
        target: /data
        bind:
          create_host_path: false
      # HDD - legacy path, retained during migration
      - type: bind
        source: /Volumes/Plex-Storage/downloads/torrents
        target: /data/torrents
        bind:
          create_host_path: false
      # SSD - copy+delete ok
      - type: bind
        source: /Volumes/Working-Storage/downloads/usenet
        target: /data/usenet
        bind:
          create_host_path: false
      # HDD
      - type: bind
        source: /Volumes/Plex-Storage/media
        target: /media_files
        bind:
          create_host_path: false
    labels:
      - "traefik.enable=true"
      # sonarr - local
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.home.arpa`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.http.routers.sonarr-http.rule=Host(`sonarr.home.arpa`)"
      - "traefik.http.routers.sonarr-http.entrypoints=web"
      # sonarr - Cloudflare tunnel
      - "traefik.http.routers.sonarr-cf.rule=Host(`sonarr.majordoob.com`)"
      - "traefik.http.routers.sonarr-cf.entrypoints=web"
      - "traefik.http.routers.sonarr-cf.service=sonarr"
    ports:
      - 8989:8989
    networks:
      - servarrnetwork
  # -----------------------------------------------------------------------------------
  # Setup sonarr used to manage movies and submit the torrent to qbittoreent
  # -----------------------------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      !!merge <<: *common-env
    volumes:
      - ./mounts/radarr:/config
      # Single parent mount: /data/media and /data/downloads/torrents live under ONE mount,
      # which is what makes hardlinks possible. See AGENTS.md -> HARDLINKS.
      - type: bind
        source: /Volumes/Plex-Storage
        target: /data
        bind:
          create_host_path: false
      # HDD - legacy path, retained during migration
      - type: bind
        source: /Volumes/Plex-Storage/downloads/torrents
        target: /data/torrents
        bind:
          create_host_path: false
      # SSD - copy+delete ok
      - type: bind
        source: /Volumes/Working-Storage/downloads/usenet
        target: /data/usenet
        bind:
          create_host_path: false
      # HDD
      - type: bind
        source: /Volumes/Plex-Storage/media
        target: /media_files
        bind:
          create_host_path: false
    labels:
      - "traefik.enable=true"
      # radarr - local
      - "traefik.http.routers.radarr.rule=Host(`radarr.home.arpa`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.http.routers.radarr-http.rule=Host(`radarr.home.arpa`)"
      - "traefik.http.routers.radarr-http.entrypoints=web"
      # radarr - Cloudflare tunnel
      - "traefik.http.routers.radarr-cf.rule=Host(`radarr.majordoob.com`)"
      - "traefik.http.routers.radarr-cf.entrypoints=web"
      - "traefik.http.routers.radarr-cf.service=radarr"
    ports:
      - 7878:7878
    networks:
      - servarrnetwork
  # -----------------------------------------------------------------------------------
  # bazarr - subtitle management for sonarr and radarr
  # -----------------------------------------------------------------------------------
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      !!merge <<: *common-env
    volumes:
      - ./mounts/bazarr:/config
      # Single parent mount - keeps bazarr's paths aligned with sonarr/radarr after migration
      - type: bind
        source: /Volumes/Plex-Storage
        target: /data
        bind:
          create_host_path: false
      # HDD - legacy path, retained during migration
      - type: bind
        source: /Volumes/Plex-Storage/media
        target: /media_files
        bind:
          create_host_path: false
    ports:
      - 6767:6767
    networks:
      - servarrnetwork
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 curl -f http://localhost:6767 || exit 1"]
      interval: 60s
      retries: 3
      start_period: 30s
      timeout: 10s
    labels:
      - "traefik.enable=true"
      # bazarr - local
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.home.arpa`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
      - "traefik.http.routers.bazarr-http.rule=Host(`bazarr.home.arpa`)"
      - "traefik.http.routers.bazarr-http.entrypoints=web"
      - "traefik.http.routers.bazarr-http.middlewares=redirect-to-https"
      # bazarr - Cloudflare tunnel
      - "traefik.http.routers.bazarr-cf.rule=Host(`bazarr.majordoob.com`)"
      - "traefik.http.routers.bazarr-cf.entrypoints=web"
      - "traefik.http.routers.bazarr-cf.service=bazarr"
  # -----------------------------------------------------------------------------------
  # Jellyfin Media Server - runs natively on macOS (not in Docker)
  # Traefik routing configured in traefik-dynamic.yml
  # -----------------------------------------------------------------------------------
  # -----------------------------------------------------------------------------------
  # Unpackerr - Extracts archived torrent downloads for Sonarr imports
  # -----------------------------------------------------------------------------------
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    user: "501:20"
    environment:
      !!merge <<: *common-env
      UN_LOG_FILE: /data/torrents/unpackerr.log
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: filepath:/run/secrets/sonarr_api_key
      # Must match the path Sonarr reports post-hardlink-migration (single /data mount)
      UN_SONARR_0_PATHS_0: /data/downloads/torrents/tv
      UN_SONARR_0_PROTOCOLS: torrent,TorrentDownloadProtocol
    volumes:
      # Single parent mount - unpackerr must see the same paths sonarr reports post-migration
      - type: bind
        source: /Volumes/Plex-Storage
        target: /data
        bind:
          create_host_path: false
      # legacy path, retained during migration
      - type: bind
        source: /Volumes/Plex-Storage/downloads/torrents
        target: /data/torrents
        bind:
          create_host_path: false
    secrets:
      - sonarr_api_key
    networks:
      - servarrnetwork
    depends_on:
      - sonarr
  # -----------------------------------------------------------------------------------
  # Cloudflare Tunnel - Secure external access without port forwarding
  # -----------------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run --token-file /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    networks:
      - servarrnetwork
    depends_on:
      - traefik
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready", "--metrics", "localhost:20241"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # -----------------------------------------------------------------------------------
  # Tdarr - Automated media transcoding (adds AAC audio tracks for HomePod compatibility)
  # -----------------------------------------------------------------------------------
  # tdarr:
  #   image: ghcr.io/haveagitgat/tdarr:latest
  #   container_name: tdarr
  #   cpus: 2
  #   restart: unless-stopped
  #   environment:
  #     !!merge <<: *common-env
  #     serverIP: 0.0.0.0
  #     serverPort: 8266
  #     webUIPort: 8265
  #     internalNode: "false"
  #     inContainer: "true"
  #     ffmpegVersion: 7
  #     nodeName: InternalNode
  #   volumes:
  #     - ./mounts/tdarr/server:/app/server
  #     - ./mounts/tdarr/configs:/app/configs
  #     - ./mounts/tdarr/logs:/app/logs
  #     - /Volumes/Plex-Storage/media:/data_files
  #     - /Volumes/Working-Storage/tdarr_cache:/temp # SSD - transcode cache
  #   ports:
  #     - 8265:8265 # Web UI
  #     - 8266:8266 # Server port
  #   networks:
  #     - servarrnetwork
  #   labels:
  #     - "traefik.enable=true"
  #     # tdarr - local
  #     - "traefik.http.routers.tdarr.rule=Host(`tdarr.home.arpa`)"
  #     - "traefik.http.routers.tdarr.entrypoints=websecure"
  #     - "traefik.http.routers.tdarr.tls=true"
  #     - "traefik.http.services.tdarr.loadbalancer.server.port=8265"
  #     - "traefik.http.routers.tdarr-http.rule=Host(`tdarr.home.arpa`)"
  #     - "traefik.http.routers.tdarr-http.entrypoints=web"
  #     - "traefik.http.routers.tdarr-http.middlewares=redirect-to-https"
  # Tautulli removed 2026-07-30 (Plex stats no longer tracked here).
  # Config backed up to /Users/tanjiro/containers/backups/tautulli-config-*.tar.gz;
  # ./mounts/tautulli retained on disk as a snapshot. Freed port 8181.
  # -----------------------------------------------------------------------------------
  # seerr - media request management for plex (migrated from overseerr)
  # -----------------------------------------------------------------------------------
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: unless-stopped
    environment:
      TZ: America/New_York
    volumes:
      - ./mounts/overseerr:/app/config
    ports:
      - 5055:5055
    networks:
      - servarrnetwork
    labels:
      - "traefik.enable=true"
      # seerr - Cloudflare tunnel (keeping overseerr domain name)
      - "traefik.http.routers.seerr-cf.rule=Host(`overseerr.majordoob.com`)"
      - "traefik.http.routers.seerr-cf.entrypoints=web"
      - "traefik.http.routers.seerr-cf.service=seerr"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
  # -----------------------------------------------------------------------------------
  # homepage
  # -----------------------------------------------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      !!merge <<: *common-env
      HOMEPAGE_ALLOWED_HOSTS: 192.168.1.2:3000,homepage.home.arpa,homepage.majordoob.com
    ports:
      - 3000:3000
    volumes:
      - ./mounts/homepage/:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - servarrnetwork
    labels:
      - "traefik.enable=true"
      # homepage - local
      - "traefik.http.routers.homepage.rule=Host(`homepage.home.arpa`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.routers.homepage.service=homepage"
      - "traefik.http.routers.homepage-http.rule=Host(`homepage.home.arpa`)"
      - "traefik.http.routers.homepage-http.entrypoints=web"
      - "traefik.http.routers.homepage-http.middlewares=redirect-to-https"
      - "traefik.http.routers.homepage-http.service=homepage"
      # homepage - Cloudflare tunnel
      - "traefik.http.routers.homepage-cf.rule=Host(`homepage.majordoob.com`)"
      - "traefik.http.routers.homepage-cf.entrypoints=web"
      - "traefik.http.routers.homepage-cf.service=homepage"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
  # -----------------------------------------------------------------------------------
  # Ofelia - Docker Job Scheduler (runs Recyclarr sync daily)
  # -----------------------------------------------------------------------------------
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia
    restart: unless-stopped
    depends_on:
      - recyclarr
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "ofelia.enabled=true"
  # -----------------------------------------------------------------------------------
  # Recyclarr - Syncs TRaSH Guides to Radarr/Sonarr
  # -----------------------------------------------------------------------------------
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    restart: unless-stopped
    user: 501:20
    environment:
      TZ: America/New_York
    volumes:
      - ./mounts/recyclarr:/config
      - ./tofu-stack-secrets/recyclarr-secrets.yml:/config/secrets.yml:ro
    networks:
      - servarrnetwork
    labels:
      - "ofelia.enabled=true"
      - "ofelia.job-exec.recyclarr-sync.schedule=0 0 3 * * *"
      - "ofelia.job-exec.recyclarr-sync.command=recyclarr sync"
  # -----------------------------------------------------------------------------------
  # Huntarr - Actively searches for missing content in Radarr/Sonarr libraries
  # -----------------------------------------------------------------------------------
  huntarr:
    image: huntarr/huntarr:latest
    container_name: huntarr
    restart: unless-stopped
    environment:
      !!merge <<: *common-env
    volumes:
      - huntarr-config:/config
    ports:
      - 9705:9705
    networks:
      - servarrnetwork
    labels:
      - "traefik.enable=true"
      # huntarr - local
      - "traefik.http.routers.huntarr.rule=Host(`huntarr.home.arpa`)"
      - "traefik.http.routers.huntarr.entrypoints=websecure"
      - "traefik.http.routers.huntarr.tls=true"
      - "traefik.http.services.huntarr.loadbalancer.server.port=9705"
      - "traefik.http.routers.huntarr-http.rule=Host(`huntarr.home.arpa`)"
      - "traefik.http.routers.huntarr-http.entrypoints=web"
      - "traefik.http.routers.huntarr-http.middlewares=redirect-to-https"
      # huntarr - Cloudflare tunnel
      - "traefik.http.routers.huntarr-cf.rule=Host(`huntarr.majordoob.com`)"
      - "traefik.http.routers.huntarr-cf.entrypoints=web"
      - "traefik.http.routers.huntarr-cf.service=huntarr"
  # -----------------------------------------------------------------------------------
  # Pinchflat - YouTube channel archiver for Plex (kid-safe curated content)
  # Downloads videos + Plex-compatible NFO/thumbnail metadata so Plex can index them
  # -----------------------------------------------------------------------------------
  pinchflat:
    # Pinned: `latest` tag is missing arm64 manifests (amd64-only)
    image: ghcr.io/kieraneglin/pinchflat:v2025.6.6
    container_name: pinchflat
    restart: unless-stopped
    environment:
      !!merge <<: *common-env
      TZ: America/New_York
    volumes:
      - ./mounts/pinchflat:/config
      - type: bind
        source: /Volumes/Plex-Storage/media/youtube
        target: /downloads
        bind:
          create_host_path: false
      # yt-dlp needs a JS runtime for YouTube player deobfuscation; pinchflat image lacks one.
      - ./mounts/pinchflat/bin/deno:/usr/local/bin/deno:ro
    ports:
      - 8945:8945
    networks:
      - servarrnetwork
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://localhost:8945/ >/dev/null || exit 1"]
      interval: 60s
      retries: 3
      start_period: 30s
      timeout: 10s
    labels:
      - "traefik.enable=true"
      # pinchflat - local
      - "traefik.http.routers.pinchflat.rule=Host(`pinchflat.home.arpa`)"
      - "traefik.http.routers.pinchflat.entrypoints=websecure"
      - "traefik.http.routers.pinchflat.tls=true"
      - "traefik.http.services.pinchflat.loadbalancer.server.port=8945"
      - "traefik.http.routers.pinchflat-http.rule=Host(`pinchflat.home.arpa`)"
      - "traefik.http.routers.pinchflat-http.entrypoints=web"
      - "traefik.http.routers.pinchflat-http.middlewares=redirect-to-https"
secrets:
  openvpn_user:
    file: tofu-stack-secrets/openvpn_user.txt
  openvpn_pass:
    file: tofu-stack-secrets/openvpn_pass.txt
  nzbget_pass:
    file: tofu-stack-secrets/nzbget_pass.txt
  nzbget_user:
    file: tofu-stack-secrets/nzbget_user.txt
  tunnel_token:
    file: tofu-stack-secrets/cloudflare_tunnel_key.txt
  sonarr_api_key:
    file: tofu-stack-secrets/sonarr_api_key.txt
volumes:
  gluetun-tmp:
  sonarr-config:
    external: true
    name: tofu-stack_sonarr-config
  huntarr-config:
    external: true
    name: tofu-stack_huntarr-config
